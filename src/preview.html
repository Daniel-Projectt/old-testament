<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1 Samuel artwork</title>
<style>
:root{--bg:#f5f1e8;--surface:#fffdf7;--ink:#1d1b17;--muted:#8c8475;--gold:#557a55;--gold-soft:#b3c9a7;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Cambria,"Times New Roman",serif;
  --sans:Optima,Candara,"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%}
body{font-family:var(--serif);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.page{position:relative;width:1200px;height:630px;background:var(--bg);background-image:radial-gradient(760px 420px at 50% 30%,#fffdf7 0%,rgba(255,253,247,0) 72%)}
.frame{position:absolute;inset:30px;border:2px solid rgba(85,122,85,.40)}
.frame::before{content:"";position:absolute;inset:10px;border:1px solid rgba(154,122,68,.28)}
.frame .dm{position:absolute;width:12px;height:12px;background:var(--gold);transform:rotate(45deg)}
.frame .dm.tl{left:-7px;top:-7px}.frame .dm.tr{right:-7px;top:-7px}.frame .dm.bl{left:-7px;bottom:-7px}.frame .dm.br{right:-7px;bottom:-7px}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.emblem{width:92px;height:92px;color:var(--gold-soft);margin-bottom:18px}
.eyebrow{font-family:var(--sans);font-size:16px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{font-weight:400;font-size:66px;line-height:1.08;margin:0;letter-spacing:.005em}
.orn{color:var(--gold-soft);width:340px;height:auto;margin:22px auto 0;display:block}
.sub{margin:18px 0 0;color:var(--muted);font-style:italic;font-size:21px}
.sub2{margin:6px 0 0;color:var(--muted);font-size:16px;font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase}
body.icon .page{width:512px;height:512px;background-image:radial-gradient(360px 300px at 50% 36%,#fffdf7 0%,rgba(255,253,247,0) 72%)}
body.icon .frame{inset:24px}
body.icon .emblem{width:280px;height:280px;margin:0 0 10px}
body.icon .eyebrow,body.icon h1,body.icon .orn,body.icon .sub,body.icon .sub2{display:none}
.short{display:none}
body.icon .short{display:block;font-family:var(--sans);font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 0 .34em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flourish" viewBox="0 0 320 44">
    <g id="flh" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M160 22 C132 22 110 6 80 14 C60 19 48 30 30 24"/>
      <path d="M30 24 c-7-3-14 2-12 8 c2 5 9 5 10 0 c0.6-3-2-5-4.5-4"/>
      <path d="M158 30 C130 34 114 24 88 28 C74 30 66 37 54 36" stroke-width=".8" opacity=".75"/>
      <path d="M54 36 c-5-1-9 3-7 7 c2 3 6 2 6-1" stroke-width=".8" opacity=".75"/>
      <path d="M104 15 c3-10 12-15 22-13 c-4 7-12 12-22 13z" fill="currentColor" stroke="none" opacity=".9"/>
      <path d="M130 19 c3 8 11 13 20 11 c-3-6-10-11-20-11z" fill="currentColor" stroke="none" opacity=".75"/>
      <path d="M70 18 c2-7 9-10 15-8 c-3 5-8 8-15 8z" fill="currentColor" stroke="none" opacity=".7"/>
    </g>
    <use href="#flh" transform="matrix(-1 0 0 1 320 0)"/>
    <path d="M160 16 l6 6-6 6-6-6z" fill="currentColor"/>
  </symbol>
  <!-- masthead seal: an olive sprig, for the anointing oil of 1 Samuel -->
  <symbol id="emblem" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="59" fill="none" stroke="currentColor" stroke-width=".5" opacity=".35"/>
    <circle cx="60" cy="60" r="56.5" fill="none" stroke="currentColor" stroke-width=".9" opacity=".55"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width=".7" opacity=".5"/>
    <path d="M34 90 Q54 54 88 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="50.7" cy="72.6" rx="8" ry="3" transform="rotate(-17 50.7 72.6)" fill="currentColor" opacity=".8"/>
    <ellipse cx="43.1" cy="67.3" rx="8" ry="3" transform="rotate(-93 43.1 67.3)" fill="currentColor" opacity=".8"/>
    <ellipse cx="60.6" cy="60.8" rx="8" ry="3" transform="rotate(-11 60.6 60.8)" fill="currentColor" opacity=".8"/>
    <ellipse cx="53.6" cy="54.7" rx="8" ry="3" transform="rotate(-87 53.6 54.7)" fill="currentColor" opacity=".8"/>
    <ellipse cx="71.6" cy="50.0" rx="8" ry="3" transform="rotate(-6 71.6 50.0)" fill="currentColor" opacity=".8"/>
    <ellipse cx="65.3" cy="43.3" rx="8" ry="3" transform="rotate(-82 65.3 43.3)" fill="currentColor" opacity=".8"/>
    <ellipse cx="82.5" cy="41.3" rx="8" ry="3" transform="rotate(-0 82.5 41.3)" fill="currentColor" opacity=".8"/>
    <ellipse cx="76.7" cy="34.1" rx="8" ry="3" transform="rotate(-76 76.7 34.1)" fill="currentColor" opacity=".8"/>
    <ellipse cx="93.0" cy="28.7" rx="7" ry="2.8" transform="rotate(-33 93.0 28.7)" fill="currentColor" opacity=".8"/>
    <circle cx="52.2" cy="71.5" r="3" fill="currentColor"/>
    <circle cx="55.0" cy="52.9" r="3" fill="currentColor"/>
    <circle cx="72.7" cy="49.7" r="3" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".6"><path d="M60 1v7M60 112v7M1 60h7M112 60h7"/></g>
  </symbol>
</svg>
<div class="page">
  <div class="frame"><span class="dm tl"></span><span class="dm tr"></span><span class="dm bl"></span><span class="dm br"></span></div>
  <div class="inner">
    <svg class="emblem" viewBox="0 0 120 120"><use href="#emblem"/></svg>
    <p class="short">1 SAM</p>
    <p class="eyebrow">Study Guide</p>
    <h1>Old Testament</h1>
    <svg class="orn" viewBox="0 0 320 44"><use href="#flourish"/></svg>
    <p class="sub">1 Samuel &middot; notes, flashcards, match, quizzes and a practice quiz</p>
    <p class="sub2">Samuel, the last judge &middot; Saul, the first king &middot; David</p>
  </div>
</div>
<script>if(/icon/.test(location.search)) document.body.className = "icon";</script>
</body>
</html>
